# ============================================================
# Bloqueio server-side de crawlers que queimam banda.
#
# robots.txt é só sugestão; GPTBot/Amazonbot seguem batendo nas páginas de
# busca, então o corte que realmente economiza egress é responder 403.
#
# Medido em 14/09 (access log da VM): GPTBot 72.721 req/dia + Amazonbot
# 10.511 = ~80% de todo o tráfego do site.
# NÃO incluir GoogleHC: é o health check do load balancer — bloquear
# derruba o backend (e, no Cloud Run, o startup probe).
# A negação fica no <RequireAll> do <Directory> em avscms.conf.
# ============================================================
SetEnvIfNoCase User-Agent "GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|anthropic-ai|PerplexityBot|Amazonbot|MJ12bot|AhrefsBot|SemrushBot|DotBot|Bytespider|CCBot|DataForSeoBot|PetalBot|ImagesiftBot|Diffbot|magpie-crawler|Scrapy|Barkrowler|ZoominfoBot" avscms_bad_bot
