# ============================================================
# AVSCMS — VirtualHost do container (Cloud Run).
# Equivalente ao deploy/avscms-prod.conf da VM, com duas diferenças:
#   - escuta em 8080 (o Cloud Run injeta o tráfego em $PORT);
#   - não há SetEnv SITE_BASE_URL: o app deriva a base do Host header,
#     então funciona igual no *.run.app e no domínio mapeado.
# Os rewrites ficam AQUI (AllowOverride None), como na produção da VM —
# o .htaccess do repo é do ambiente local (/avscms) e é ignorado.
# ============================================================
<VirtualHost *:8080>
    ServerName pornozinho.com
    ServerAlias www.pornozinho.com
    DocumentRoot /var/www/html

    # ---- SECURITY: nunca servir código/segredos por HTTP ----
    # include/ tem config.*.php e a chave da service account; deploy/ e sql/
    # são só de deploy. São acessados por include/require, nunca por URL.
    <DirectoryMatch "^/var/www/html/(include|deploy|sql)(/|$)">
        Require all denied
    </DirectoryMatch>

    # ---- SECURITY: nunca servir dotfiles / .env ----
    <FilesMatch "^\.(env|env\..+|htaccess|htpasswd)$">
        Require all denied
    </FilesMatch>

    # Crawlers de IA/SEO: 403 (ver docker/avscms-bots.conf). Eles faziam ~80%
    # das requests e o egress era pago por elas.
    Include /etc/apache2/conf-available/avscms-bots.conf

    <Directory /var/www/html>
        Options -MultiViews +FollowSymLinks
        AllowOverride None
        AcceptPathInfo On

        <RequireAll>
            Require all granted
            Require not env avscms_bad_bot
        </RequireAll>

        RewriteEngine On

        # Arquivos/dirs existentes são servidos direto
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # ajax.php cuida do próprio path-info
        RewriteRule ^ajax\.php - [L]

        # Todo o resto vai para loader.php (/video/16/slug, /videos, ...)
        RewriteCond %{REQUEST_URI} !^/$
        RewriteCond %{REQUEST_URI} !^/index(\.php)?/?$ [NC]
        RewriteRule ^(.*)$ loader.php/$1 [L,QSA]
    </Directory>

    # Logs no stdout/stderr (Cloud Logging captura)
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
