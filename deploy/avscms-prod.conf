# ============================================================
# AVSCMS production VirtualHost — VM (pornozinho-vm)
# Install: /etc/apache2/sites-available/avscms.conf
# Served by the global HTTPS LB (pornozinho.com -> 136.69.113.59)
# LB terminates TLS; this vhost handles HTTP on :80 behind the LB.
#
# NOTE: Rewrites live here (AllowOverride None), so the repo's
# .htaccess (tuned for local /avscms) is ignored in production.
# ============================================================
<VirtualHost *:80>
    ServerName pornozinho.com
    ServerAlias www.pornozinho.com
    DocumentRoot /var/www/avscms

    # App needs the real public base URL for all *.URL constants
    # (include/config.paths.php reads SITE_BASE_URL)
    SetEnv SITE_BASE_URL https://pornozinho.com
    SetEnv SITE_RELATIVE ''

    # ---- SECURITY: never serve code/secret dirs over HTTP ----
    # include/ holds config.*.php and the GCS service-account key (private).
    # deploy/ and sql/ are deploy-time only. These are reached via PHP
    # filesystem include/require, never via URL.  (.htaccess is ignored here
    # — AllowOverride None — so the block must live in the vhost.)
    <DirectoryMatch "^/var/www/avscms/(include|deploy|sql)(/|$)">
        Require all denied
    </DirectoryMatch>

    # ---- SECURITY: never serve dotfiles / env files over HTTP ----
    # .env carries DB/admin/GCS secrets; block any dotfile in the webroot.
    <FilesMatch "^\.(env|env\..+|htaccess|htpasswd)$">
        Require all denied
    </FilesMatch>

    <Directory /var/www/avscms>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        AcceptPathInfo On

        # Rewrite rules MUST live in the <Directory> (per-dir) context so that
        # the -f/-d conditions resolve against the real filesystem path.
        RewriteEngine On

        # Serve existing files/dirs directly
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Let ajax.php handle its own path-info routing
        RewriteRule ^ajax\.php - [L]

        # Everything else -> loader.php (handles /video/16/slug, /videos, etc.)
        RewriteCond %{REQUEST_URI} !^/$
        RewriteCond %{REQUEST_URI} !^/index(\.php)?/?$ [NC]
        RewriteRule ^(.*)$ loader.php/$1 [L,QSA]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/avscms-error.log
    CustomLog ${APACHE_LOG_DIR}/avscms-access.log combined

    # Let the GCP LB health checks reach the health endpoint
    <Location /lbcheck>
        Require all granted
    </Location>
</VirtualHost>