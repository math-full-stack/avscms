name: Deploy to Cloud Run (pornozinho)

# Cada push em `main` builda a imagem (Cloud Build) e publica no Cloud Run.
# Env vars não-secretas vêm de deploy/cloudrun.env; segredos vêm dos Secrets
# do repositório (GCP_SA_KEY, DB_PASSWORD, ADMIN_PASS).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_build:
        description: 'Redeploy last image without building'
        type: boolean
        required: false
        default: false

env:
  PROJECT_ID: pornozinho-510422
  REGION: southamerica-east1
  SERVICE: pornozinho
  SQL_INSTANCE: pornozinho-510422:southamerica-east1:pornozinho-sql
  RUNTIME_SA: pornozinho-cloudrun@pornozinho-510422.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 490.0.0'

      - name: Build env vars (não-secretas + segredos)
        run: |
          cp deploy/cloudrun.env /tmp/cr-env.yaml
          printf 'DB_PASSWORD: "%s"\n' "$DB_PASSWORD" >> /tmp/cr-env.yaml
          printf 'ADMIN_PASS: "%s"\n' "$ADMIN_PASS" >> /tmp/cr-env.yaml
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

      - name: Build and deploy to Cloud Run
        if: ${{ !inputs.no_build }}
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --source=. \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --service-account=${{ env.RUNTIME_SA }} \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=10 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=600 \
            --concurrency=80 \
            --env-vars-file=/tmp/cr-env.yaml \
            --quiet

      - name: Redeploy last image (no build)
        if: ${{ inputs.no_build }}
        run: |
          IMAGE=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="value(spec.template.spec.containers[0].image)")
          gcloud run services update ${{ env.SERVICE }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --image="$IMAGE" \
            --env-vars-file=/tmp/cr-env.yaml \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "Cloud Run: $URL/"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/" || echo 000)
            echo "tentativa $i -> $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "Smoke test falhou"
          exit 1
