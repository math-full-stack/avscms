name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VM_NAME: pornozinho-vm
  VM_ZONE: southamerica-east1-a
  PROJECT_ID: novinhasbr
  DEPLOY_PATH: /var/www/avscms

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 480.0.0'
          project_id: ${{ env.PROJECT_ID }}

      - name: Rsync files to VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="mkdir -p ${{ env.DEPLOY_PATH }}"
          gcloud compute scp --recurse . ${{ env.VM_NAME }}:${{ env.DEPLOY_PATH }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.PROJECT_ID }}

      - name: Run SQL migrations
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="
              cd ${{ env.DEPLOY_PATH }} &&
              for f in sql/*.sql; do
                [ -f \"\$f\" ] && mysql -u\${DB_USER} -p\${DB_PASSWORD} \${DB_NAME} < \"\$f\"
              done
            "

      - name: Reload Apache
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="sudo systemctl reload apache2"