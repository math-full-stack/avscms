name: Deploy to VM (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VM_HOST: ${{ secrets.VM_HOST }}
  VM_USER: ${{ secrets.VM_USER }}
  VM_PATH: /var/www/avscms
  BACKUP_DIR: /var/www/avscms.backups

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          for s in VM_HOST VM_USER SSH_PRIVATE_KEY DB_USER DB_PASSWORD DB_NAME; do
            if [[ -z "${{ secrets[$s] }}" ]]; then
              echo "::error::Secret $s não configurado"
              exit 1
            fi
          done
          echo "✅ Todos os secrets presentes"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connectivity
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            ${{ env.VM_USER }}@${{ env.VM_HOST }} "echo 'SSH OK'"

      - name: Pre-deploy backup (timestamped)
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.VM_HOST }} "
              sudo mkdir -p ${{ env.BACKUP_DIR }} &&
              sudo cp -r ${{ env.VM_PATH }} ${{ env.BACKUP_DIR }}/avscms-\$TIMESTAMP &&
              echo 'Backup criado: ${{ env.BACKUP_DIR }}/avscms-'$TIMESTAMP
            "

      - name: Deploy files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '*.log' \
            --exclude 'setup-deploy.sh' \
            . ${{ env.VM_USER }}@${{ env.VM_HOST }}:${{ env.VM_PATH }}/

      - name: Run SQL migrations
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.VM_HOST }} "
              cd ${{ env.VM_PATH }} &&
              for f in sql/*.sql; do
                if [ -f \"\$f\" ]; then
                  echo 'Aplicando: '\$f
                  mysql -u\${DB_USER} -p\${DB_PASSWORD} \${DB_NAME} < \"\$f\"
                fi
              done
            "
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Set permissions (storage, cache, uploads)
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.VM_HOST }} "
              cd ${{ env.VM_PATH }} &&
              sudo chown -R www-data:www-data . &&
              find . -type d -exec chmod 755 {} \\; &&
              find . -type f -exec chmod 644 {} \\; &&
              chmod +x *.sh 2>/dev/null || true
            "

      - name: Reload Apache
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.VM_HOST }} "sudo systemctl reload apache2"

      - name: Post-deploy health check
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "http://${{ env.VM_HOST }}/" || echo "000")
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
            echo "✅ Health check OK: HTTP $HTTP_CODE"
          else
            echo "::error::Health check falhou: HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Cleanup old backups (keep last 5)
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.VM_HOST }} "
              ls -dt ${{ env.BACKUP_DIR }}/avscms-* 2>/dev/null | tail -n +6 | xargs -r sudo rm -rf
            "

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rollback to latest backup
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ env.VM_USER }}@${{ env.VM_HOST }} "
              LATEST=$(ls -dt ${{ env.BACKUP_DIR }}/avscms-* 2>/dev/null | head -1)
              if [[ -n \"\$LATEST\" ]]; then
                echo 'Restaurando: '\$LATEST
                sudo rm -rf ${{ env.VM_PATH }} &&
                sudo cp -r \"\$LATEST\" ${{ env.VM_PATH }} &&
                sudo chown -R www-data:www-data ${{ env.VM_PATH }} &&
                sudo systemctl reload apache2 &&
                echo '✅ Rollback concluído'
              else
                echo '❌ Nenhum backup encontrado'
                exit 1
              fi
            "