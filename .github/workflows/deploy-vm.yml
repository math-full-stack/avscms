name: Deploy to VM (Self-hosted Runner)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/avscms
  BACKUP_DIR: /var/www/avscms.backups

jobs:
  deploy:
    runs-on: [self-hosted, linux, prod]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify directory
        run: |
          ls -la ${{ env.DEPLOY_PATH }}

      - name: Pre-deploy backup (timestamped)
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          sudo mkdir -p ${{ env.BACKUP_DIR }}
          sudo cp -r ${{ env.DEPLOY_PATH }} ${{ env.BACKUP_DIR }}/avscms-$TIMESTAMP
          echo "Backup criado: ${{ env.BACKUP_DIR }}/avscms-$TIMESTAMP"

      - name: Run SQL migrations
        run: |
          cd ${{ env.DEPLOY_PATH }}
          for f in sql/*.sql; do
            if [ -f "$f" ]; then
              echo "Aplicando: $f"
              mysql -h 127.0.0.1 -P 3306 -u${DB_USER} -p${DB_PASSWORD} --skip-ssl ${DB_NAME} < "$f"
            fi
          done
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Set permissions
        run: |
          cd ${{ env.DEPLOY_PATH }}
          sudo chown -R www-data:www-data .
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod +x *.sh 2>/dev/null || true

      - name: Reload Apache
        run: sudo systemctl reload apache2

      - name: Post-deploy health check
        run: |
          sleep 2
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://localhost/ || echo "000")
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
            echo "✅ Health check OK: HTTP $HTTP_CODE"
          else
            echo "::error::Health check falhou: HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Cleanup old backups (keep last 5)
        if: always()
        run: |
          ls -dt ${{ env.BACKUP_DIR }}/avscms-* 2>/dev/null | tail -n +6 | xargs -r sudo rm -rf

  rollback:
    runs-on: [self-hosted, linux, prod]
    if: failure()
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Rollback to latest backup
        run: |
          LATEST=$(ls -dt ${{ env.BACKUP_DIR }}/avscms-* 2>/dev/null | head -1)
          if [[ -n "$LATEST" ]]; then
            echo "Restaurando: $LATEST"
            sudo rm -rf ${{ env.DEPLOY_PATH }}
            sudo cp -r "$LATEST" ${{ env.DEPLOY_PATH }}
            sudo chown -R www-data:www-data ${{ env.DEPLOY_PATH }}
            sudo systemctl reload apache2
            echo "✅ Rollback concluído"
          else
            echo "❌ Nenhum backup encontrado"
            exit 1
          fi