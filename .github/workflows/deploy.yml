name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy AVSCMS to GCP VM
        run: bash ./deploy.sh
        env:
          GCLOUD_ZONE: southamerica-east1-c
          GCLOUD_INSTANCE: xbrasil
          GCLOUD_PROJECT: flashentrega
          GCLOUD_SSH_USER: matheussturiao
          GCLOUD_REMOTE_DIR: /var/www/html/avscms
          GCLOUD_SITE_URL: https://novinhasbr.net